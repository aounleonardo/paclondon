[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Function routes use `config.path` in each file (/api/borough/:id/...).
# SPA fallback must stay last so /api/* is not swallowed.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
